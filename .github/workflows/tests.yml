name: Tests

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .

  types:
    name: Types (pyright)
    runs-on: ubuntu-latest
    # Pyright is pinned: a newer version finds new things, for us to fix
    # when we choose to move.  PyQt6 6.12.1 types every QtCore.Signal(...)
    # as missing an argument: stay on 6.12.0 until the stubs are right.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyright==1.1.414 PyQt6==6.12.0 PyQt6-Qt6==6.12.0 qtpy numpy pandas pyqtgraph parse
      - run: pip install git+https://github.com/davidgrier/QInstrument.git
      - run: pip install -e . --no-deps
      - run: pyright

  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0 \
            libfontconfig1 \
            libfreetype6

      - name: Install Python dependencies
        run: pip install PyQt6 qtpy numpy pytest pytest-qt pyqtgraph parse

      - name: Install QInstrument
        run: pip install git+https://github.com/davidgrier/QInstrument.git

      - name: Install QPolargraph
        run: pip install -e .

      - name: Run tests
        run: pytest tests/
        env:
          QT_QPA_PLATFORM: offscreen
