[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "QPolargraph"
version = "1.5.0"
description = "Qt-based interface for a two-dimensional polargraph scanner"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = ["polargraph", "scanner", "stepper motor", "Arduino", "Qt", "scientific instrument"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "qtpy>=2.0",
    "pyqtgraph>=0.13",
    "parse>=1.19",
    "QInstrument>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "ruff",
]
docs = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.16",
    "sphinx-autodoc-typehints>=2.0",
    "PyQt5",
]

[project.gui-scripts]
qpolargraph = "QPolargraph.QScanner:QScanner.example"
qpolargraph-flash = "QPolargraph.FlashFirmware:main"

[project.urls]
Homepage = "https://github.com/davidgrier/QPolargraph"
Repository = "https://github.com/davidgrier/QPolargraph"
Documentation = "https://qpolargraph.readthedocs.io"
"Issue Tracker" = "https://github.com/davidgrier/QPolargraph/issues"

# The project root IS the QPolargraph package — no src/ subdirectory.
[tool.setuptools]
package-dir = {"QPolargraph" = "."}
packages = [
    "QPolargraph",
    "QPolargraph.hardware",
    "QPolargraph.patterns",
]

[tool.setuptools.package-data]
"QPolargraph" = ["**/*.ui", "**/*.png"]
"QPolargraph.hardware" = ["arduino/**/*.ino"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.exclude-package-data]
"QPolargraph" = [".qp/**", "tests/**", "docs/**"]

[tool.ruff]
line-length = 79
# The environment lives in the tree, in .qp.
extend-exclude = [".qp", "docs/_build"]

[tool.ruff.lint]
# F pyflakes, B bugbear, E501 line length, Q quotes, RUF012 mutable class
# attributes, RUF100 stale noqa, UP037 quoted annotations; E402 imports at
# the top, E731 lambda assigned, E741 ambiguous name, SIM105 suppress,
# SIM115 file without a context manager, SIM118 key in dict, RUF015 first
# element, RUF059 unused unpacked variable, PERF401 comprehension,
# PLW0108 needless lambda, PLW1510 subprocess without check, TID252 a
# relative import of a parent (a sibling is imported as `.name`), A001 and
# A002 a name that hides a builtin, SIM300 yoda comparison, C400 and C401 a
# generator that is a comprehension, PLW2901 a loop variable that is
# overwritten.
select = ["F", "B", "E402", "E501", "E731", "E741", "Q", "SIM105",
          "SIM115", "SIM118", "PERF401", "PLW0108", "PLW1510", "RUF012",
          "RUF015", "RUF059", "RUF100", "TID252", "UP037", "A001", "A002",
          "SIM300", "C400", "C401", "PLW2901"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Package files re-export names; tests build stubs and mocks.
"__init__.py" = ["F401"]
# Sphinx reads the name `copyright`.
"docs/conf.py" = ["A001", "E402"]
# Tests import after patching, unpack to name what they do not use, and
# keep a temporary file open across a test.
"tests/*" = ["E402", "E501", "F401", "F811", "F841", "B018", "B905",
             "RUF012", "RUF059", "SIM115"]
